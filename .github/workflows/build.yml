        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - run: rm -rf android
      - run: flutter create --project-name global_sports --org com.example --platforms=android.name: build
