name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - run: |
          rm -rf android
          flutter create . --platforms=android --org com.global --project-name global_sports_live
      - run: flutter pub get
      - run: |
          python3 -m pip install Pillow
          python3 -c "from PIL import Image; im=Image.open('assets/logo.png').convert('RGBA'); b='android/app/src/main/res'; [(__import__('os').makedirs(b+'/'+f,exist_ok=True), im.resize((px,px),Image.LANCZOS).save(b+'/'+f+'/ic_launcher.png')) for f,px in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items()]"
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: global-sports-live-apk
          path: build/app/outputs/flutter-apk/app-release.apk
