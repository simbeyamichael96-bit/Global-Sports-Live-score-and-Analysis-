name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Fix App Name and Permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "INTERNET" $MANIFEST || sed -i '/<manifest/a \ <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          sed -i 's/android:label=".*"/android:label="Global Sports Live score and Match analysis"/' $MANIFEST
          grep -q "com.google.android.gms.ads.APPLICATION_ID" $MANIFEST || sed -i '/<application/a \ <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6198433078225470~2062108416"\/>' $MANIFEST
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Global-Sports-Live-Score-and-Match-analysis-APK
          path: build/app/outputs/flutter-apk/app-release.apk
