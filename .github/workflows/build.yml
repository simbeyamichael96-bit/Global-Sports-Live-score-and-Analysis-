name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Fix Android Project V2
        run: |
          rm -rf android
          flutter create. --platforms=android --org com.global --project-name global_sports_live

      - name: Restore pubspec
        run: |
          cat > pubspec.yaml << 'EOF'
          name: global_sports_live
          description: Global Sports Live Realistic
          publish_to: 'none'
          version: 1.0.0+63
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            google_mobile_ads: ^4.0.0
            flutter_local_notifications: ^16.3.0
            cupertino_icons: ^1.0.5
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
            assets:
              - assets/logo.png
              - assets/logo_full.png
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: SET ICON MANUALLY - Weka logo yako kama Icon
        run: |
          python3 -m pip install Pillow
          python3 << 'PY'
          from PIL import Image
          import os, pathlib
          src = "assets/logo.png"
          if not os.path.exists(src):
              print(f"ERROR: {src} haipo!")
              exit(1)
          im = Image.open(src).convert("RGBA")
          # Tengeneza square background nyeupe kama logo sio square
          size = max(im.size)
          new_im = Image.new("RGBA", (size, size), (255,255,255,0))
          new_im.paste(im, ((size-im.size[0])//2, (size-im.size[1])//2))

          base = "android/app/src/main/res"
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }
          for folder, px in sizes.items():
              path = os.path.join(base, folder)
              os.makedirs(path, exist_ok=True)
              resized = new_im.resize((px, px), Image.LANCZOS)
              # Weka kama ic_launcher na launcher_icon zote mbili
              resized.save(os.path.join(path, "ic_launcher.png"))
              resized.save(os.path.join(path, "launcher_icon.png"))
              print(f"Created {folder}/ic_launcher.png {px}x{px}")
          PY

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: global-sports-live-apk
          path: build/app/outputs/flutter-apk/app-release.apk
