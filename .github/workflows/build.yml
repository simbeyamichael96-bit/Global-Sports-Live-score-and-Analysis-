name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Fix Project
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --project-name global_sports_live --platforms=android .
          cp /tmp/main.dart lib/main.dart
          cat > pubspec.yaml << 'EOF'
          name: global_sports_live
          description: Global Sports LIVE
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            google_mobile_ads: ^5.1.0
            cupertino_icons: ^1.0.2
          flutter:
            uses-material-design: true
          EOF
          # HII NDIO FIX YA KOTLIN
          sed -i "s/ext.kotlin_version =.*/ext.kotlin_version = '1.9.22'/" android/build.gradle
          flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
