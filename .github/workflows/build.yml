name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'

      - name: Fix Kotlin & Project
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --project-name global_sports_live --platforms=android .
          cp /tmp/main.dart lib/main.dart

          cat > pubspec.yaml << 'EOF'
          name: global_sports_live
          description: Global Sports LIVE - 42 Leagues
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            google_mobile_ads: ^3.1.0
            cupertino_icons: ^1.0.2
          flutter:
            uses-material-design: true
          EOF

          # REKEBISHA KOTLIN KWENYE FAILI ZOTE MBILI
          cat > android/settings.gradle << 'SETTINGS'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath!= null, "flutter.sdk not set in local.properties or not set in properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "7.3.0" apply false
              id "org.jetbrains.
