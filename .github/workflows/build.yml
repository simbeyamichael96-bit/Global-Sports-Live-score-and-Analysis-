name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Fix Android Project V2
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.global --project-name global_sports_live

      - name: Restore pubspec
        run: |
          cat > pubspec.yaml << 'EOF'
          name: global_sports_live
          description: Global Sports Live Realistic
          publish_to: 'none'
          version: 1.0.0+63
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            google_mobile_ads: ^4.0.0
            flutter_local_notifications: ^16.3.0
            cupertino_icons: ^1.0.5
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
            assets:
              - assets/logo.png
              - assets/logo_full.png
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: DEBUG - Angalia assets
        run: |
          ls -lh assets/
          file assets/*

      - name: SET ICON MANUALLY - Fix PNG
