name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Fix Embedding V2 - Regenerate Android
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example
          python3 -c "
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          txt = p.read_text()
          if 'com.google.android.gms.ads.APPLICATION_ID' not in txt:
              txt = txt.replace('<application', '<application\n android:label=\"Global Sports Live\"')
              txt = txt.replace('</application>', ''' <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-6198433078225470~2062108416\"/>
          </application>''')
              p.write_text(txt)
          print('Manifest fixed')
          "
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: GLOBAL-LIVE-MONEY-APK-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
